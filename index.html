<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warriors Scoreboard | GSW Game Results</title>
  <meta name="description" content="Live Golden State Warriors game results, win/loss record, and full game log — powered by ESPN data." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gsw-gold: #FFC72C;
      --gsw-blue: #1D428A;
      --gsw-royal: #006BB6;
      --bg: #090d1a;
      --surface: #0f1629;
      --surface2: #151d35;
      --border: rgba(255,199,44,0.12);
      --text: #e8eaf6;
      --muted: #7b82a0;
      --win: #00e676;
      --loss: #ff4d6d;
      --radius: 16px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background glow ── */
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 900px; height: 600px;
      background: radial-gradient(ellipse, rgba(29,66,138,0.4) 0%, rgba(255,199,44,0.05) 60%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      height: 64px;
      background: rgba(9,13,26,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em;
    }
    .nav-logo .badge {
      background: linear-gradient(135deg, var(--gsw-blue), var(--gsw-royal));
      color: var(--gsw-gold);
      padding: 4px 10px; border-radius: 8px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em;
    }
    .nav-tag {
      font-size: 0.78rem; color: var(--muted);
      padding: 4px 12px; border: 1px solid var(--border);
      border-radius: 20px;
    }
    #refresh-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      background: rgba(255,199,44,0.1);
      border: 1px solid rgba(255,199,44,0.3);
      color: var(--gsw-gold);
      border-radius: 10px;
      font-size: 0.8rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    #refresh-btn:hover { background: rgba(255,199,44,0.2); transform: scale(1.04); }
    #refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── HERO ── */
    .hero {
      position: relative; z-index: 1;
      text-align: center;
      padding: 4rem 1.5rem 2rem;
    }
    .team-chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(29,66,138,0.3);
      border: 1px solid rgba(29,66,138,0.6);
      padding: 6px 16px; border-radius: 30px;
      font-size: 0.78rem; font-weight: 600; color: #90b4e8;
      margin-bottom: 1.4rem;
    }
    .team-chip span { width: 8px; height: 8px; border-radius: 50%; background: var(--gsw-gold); display: block; }
    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 30%, var(--gsw-gold) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.8rem;
    }
    .hero p {
      color: var(--muted); font-size: 1rem; max-width: 500px; margin: 0 auto;
    }

    /* ── RECORD CARDS ── */
    .record-strip {
      position: relative; z-index: 1;
      display: flex; justify-content: center; gap: 1rem;
      flex-wrap: wrap;
      padding: 1.5rem 1.5rem 0;
    }
    .record-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem 2rem;
      text-align: center;
      min-width: 130px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .record-card:hover { transform: translateY(-3px); border-color: rgba(255,199,44,0.3); }
    .record-card .val {
      font-size: 2.4rem; font-weight: 900; letter-spacing: -0.04em;
      line-height: 1;
    }
    .record-card .lbl {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--muted); margin-top: 4px;
    }
    .record-card.wins .val { color: var(--win); }
    .record-card.losses .val { color: var(--loss); }
    .record-card.pct .val { color: var(--gsw-gold); }
    .record-card.streak .val { font-size: 1.6rem; }

    /* ── LATEST GAME ── */
    .latest-wrap {
      position: relative; z-index: 1;
      padding: 2rem 1.5rem 0;
      max-width: 820px; margin: 0 auto;
    }
    .section-title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.15em; color: var(--muted);
      margin-bottom: 1rem;
    }
    .latest-card {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }
    .latest-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,199,44,0.03), transparent 60%);
      pointer-events: none;
    }
    .team-side { display: flex; flex-direction: column; }
    .team-side.away { align-items: flex-start; }
    .team-side.home { align-items: flex-end; }
    .team-abbr {
      font-size: 2.6rem; font-weight: 900; letter-spacing: -0.03em;
    }
    .team-name { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .team-location { font-size: 0.7rem; color: var(--muted); opacity: 0.6; }
    .gsw-highlight .team-abbr { color: var(--gsw-gold); }

    .score-center { text-align: center; }
    .score-digits {
      font-size: 3.6rem; font-weight: 900; letter-spacing: -0.05em;
      line-height: 1;
    }
    .score-sep { color: var(--muted); padding: 0 6px; }
    .result-pill {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 14px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em;
    }
    .result-pill.win  { background: rgba(0,230,118,0.15); color: var(--win); border: 1px solid rgba(0,230,118,0.3); }
    .result-pill.loss { background: rgba(255,77,109,0.15); color: var(--loss); border: 1px solid rgba(255,77,109,0.3); }
    .game-meta { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }

    /* ── GAME LOG ── */
    .log-wrap {
      position: relative; z-index: 1;
      max-width: 820px; margin: 2rem auto 0;
      padding: 0 1.5rem 4rem;
    }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    #filter-btns { display: flex; gap: 6px; }
    .filter-btn {
      padding: 5px 14px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: rgba(255,199,44,0.12);
      border-color: rgba(255,199,44,0.4);
      color: var(--gsw-gold);
    }

    .game-row {
      display: grid;
      grid-template-columns: 90px 1fr auto auto;
      align-items: center; gap: 1rem;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: all 0.2s;
      cursor: default;
    }
    .game-row:hover {
      background: var(--surface);
      border-color: var(--border);
      transform: translateX(4px);
    }
    .game-row + .game-row { margin-top: 6px; }
    .game-date { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
    .matchup { font-size: 0.9rem; font-weight: 600; }
    .matchup .opp { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
    .home-away-tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 8px; margin-left: 6px; font-weight: 600; vertical-align: middle; }
    .home-away-tag.home { background: rgba(29,66,138,0.3); color: #90b4e8; }
    .home-away-tag.away { background: rgba(255,255,255,0.07); color: var(--muted); }
    .score-col { font-size: 0.88rem; font-weight: 700; white-space: nowrap; }
    .wl-badge {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 800;
    }
    .wl-badge.W { background: rgba(0,230,118,0.15); color: var(--win); }
    .wl-badge.L { background: rgba(255,77,109,0.15); color: var(--loss); }

    .divider {
      height: 1px; background: var(--border);
      margin: 1rem 0; border-radius: 1px;
    }

    /* ── LOADING / ERROR ── */
    #loading {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem;
      background: var(--bg);
    }
    .loader-ring {
      width: 52px; height: 52px;
      border: 3px solid rgba(255,199,44,0.15);
      border-top-color: var(--gsw-gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading p { color: var(--muted); font-size: 0.9rem; }

    #error-banner {
      display: none;
      margin: 2rem auto; max-width: 500px;
      background: rgba(255,77,109,0.1);
      border: 1px solid rgba(255,77,109,0.3);
      color: var(--loss);
      padding: 1rem 1.4rem; border-radius: 12px;
      text-align: center; font-size: 0.9rem;
      position: relative; z-index: 1;
    }

    #app { display: none; }

    /* ── Footer ── */
    footer {
      text-align: center; padding: 2rem 1rem;
      font-size: 0.72rem; color: var(--muted);
      border-top: 1px solid var(--border);
      position: relative; z-index: 1;
    }

    @media (max-width: 560px) {
      .latest-card { grid-template-columns: 1fr; text-align: center; gap: 1.2rem; }
      .team-side.home { align-items: center; }
      .team-side.away { align-items: center; }
      .game-row { grid-template-columns: 70px 1fr auto auto; gap: 0.5rem; }
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="loader-ring"></div>
  <p>Loading Warriors data…</p>
</div>

<!-- Error -->
<div id="error-banner" role="alert"></div>

<!-- App -->
<div id="app">

  <!-- Nav -->
  <nav>
    <div class="nav-logo">
      <span>🏀</span>
      <span>Warriors</span>
      <span class="badge">GSW</span>
    </div>
    <span class="nav-tag" id="updated-tag">—</span>
    <button id="refresh-btn" onclick="loadData()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Refresh
    </button>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <div class="team-chip"><span></span> Golden State Warriors · 2025–26</div>
    <h1>Warriors<br>Scoreboard</h1>
    <p>Latest results, win–loss record, and full game log.</p>
  </header>

  <!-- Record strip -->
  <section class="record-strip" id="record-strip" aria-label="Season record">
    <div class="record-card wins">
      <div class="val" id="stat-wins">—</div>
      <div class="lbl">Wins</div>
    </div>
    <div class="record-card losses">
      <div class="val" id="stat-losses">—</div>
      <div class="lbl">Losses</div>
    </div>
    <div class="record-card pct">
      <div class="val" id="stat-pct">—</div>
      <div class="lbl">Win %</div>
    </div>
    <div class="record-card streak">
      <div class="val" id="stat-streak">—</div>
      <div class="lbl">Streak</div>
    </div>
  </section>

  <!-- Latest game -->
  <section class="latest-wrap" aria-label="Most recent game">
    <div class="section-title">Most Recent Game</div>
    <div class="latest-card" id="latest-card">
      <!-- filled by JS -->
    </div>
  </section>

  <!-- Game log -->
  <section class="log-wrap" aria-label="Full game log">
    <div class="log-header">
      <div class="section-title" style="margin:0">Game Log</div>
      <div id="filter-btns">
        <button class="filter-btn active" id="btn-all"  onclick="setFilter('all')">All</button>
        <button class="filter-btn"        id="btn-wins" onclick="setFilter('W')">Wins</button>
        <button class="filter-btn"        id="btn-losses" onclick="setFilter('L')">Losses</button>
      </div>
    </div>
    <div id="game-log"></div>
  </section>

</div>

<footer>Data sourced from ESPN public API via <code>scraper.py</code> · Re-run the scraper to refresh</footer>

<script>
  const GSW = 'GSW';
  let allGames = [];
  let currentFilter = 'all';

  function fmt(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function getResult(g) {
    const gsw_score  = g.home_abbr === GSW ? +g.home_score : +g.away_score;
    const opp_score  = g.home_abbr === GSW ? +g.away_score : +g.home_score;
    return gsw_score > opp_score ? 'W' : 'L';
  }

  function getOpp(g) {
    return g.home_abbr === GSW
      ? { abbr: g.away_abbr, name: g.away_team }
      : { abbr: g.home_abbr, name: g.home_team };
  }

  function isHome(g) { return g.home_abbr === GSW; }

  function getScore(g) {
    return g.home_abbr === GSW
      ? { gsw: g.home_score, opp: g.away_score }
      : { gsw: g.away_score, opp: g.home_score };
  }

  function calcStreak(games) {
    if (!games.length) return '—';
    const res = games.map(getResult);
    const first = res[0];
    let count = 0;
    for (const r of res) { if (r === first) count++; else break; }
    return first + count;
  }

  function renderLatest(g) {
    const res   = getResult(g);
    const sc    = getScore(g);
    const opp   = getOpp(g);
    const home  = isHome(g);
    const el    = document.getElementById('latest-card');

    const awaySide = home
      ? `<div class="team-side away"><div class="team-abbr">${opp.abbr}</div><div class="team-name">${opp.name}</div><div class="team-location">Away</div></div>`
      : `<div class="team-side away gsw-highlight"><div class="team-abbr">GSW</div><div class="team-name">Golden State Warriors</div><div class="team-location">Away</div></div>`;

    const homeSide = home
      ? `<div class="team-side home gsw-highlight"><div class="team-abbr">GSW</div><div class="team-name">Golden State Warriors</div><div class="team-location">Home</div></div>`
      : `<div class="team-side home"><div class="team-abbr">${opp.abbr}</div><div class="team-name">${opp.name}</div><div class="team-location">Home</div></div>`;

    const awayScore = home ? sc.opp : sc.gsw;
    const homeScore = home ? sc.gsw : sc.opp;

    el.innerHTML = `
      ${awaySide}
      <div class="score-center">
        <div class="score-digits">
          <span>${awayScore}</span><span class="score-sep">–</span><span>${homeScore}</span>
        </div>
        <div class="result-pill ${res === 'W' ? 'win' : 'loss'}">${res === 'W' ? '✓ WIN' : '✗ LOSS'}</div>
        <div class="game-meta">${fmt(g.date)}</div>
      </div>
      ${homeSide}
    `;
  }

  function renderLog(games) {
    const el = document.getElementById('game-log');
    if (!games.length) {
      el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:2rem">No games match this filter.</p>';
      return;
    }
    el.innerHTML = games.map((g, i) => {
      const res  = getResult(g);
      const sc   = getScore(g);
      const opp  = getOpp(g);
      const home = isHome(g);
      return `
        <div class="game-row" id="game-${i}">
          <div class="game-date">${fmt(g.date)}</div>
          <div class="matchup">
            <span>${opp.abbr}</span>
            <span class="opp"> · ${opp.name}</span>
            <span class="home-away-tag ${home ? 'home' : 'away'}">${home ? 'HOME' : 'AWAY'}</span>
          </div>
          <div class="score-col" style="color:${res === 'W' ? 'var(--win)' : 'var(--loss)'}">
            ${sc.gsw} – ${sc.opp}
          </div>
          <div class="wl-badge ${res}">${res}</div>
        </div>
      `;
    }).join('');
  }

  function setFilter(f) {
    currentFilter = f;
    ['all','wins','losses'].forEach(id => document.getElementById('btn-'+id).classList.remove('active'));
    document.getElementById('btn-' + (f === 'all' ? 'all' : f === 'W' ? 'wins' : 'losses')).classList.add('active');
    const filtered = f === 'all' ? allGames : allGames.filter(g => getResult(g) === f);
    renderLog(filtered);
  }

  async function loadData() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');

    try {
      const res  = await fetch('./games.json?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      allGames = (data.games || []).filter(g => g.status === 'post');
      // sort most-recent first
      allGames.sort((a, b) => new Date(b.date) - new Date(a.date));

      const wins   = allGames.filter(g => getResult(g) === 'W').length;
      const losses = allGames.filter(g => getResult(g) === 'L').length;
      const total  = wins + losses;
      const pct    = total ? (wins / total * 100).toFixed(1) + '%' : '—';

      document.getElementById('stat-wins').textContent   = wins;
      document.getElementById('stat-losses').textContent = losses;
      document.getElementById('stat-pct').textContent    = pct;
      document.getElementById('stat-streak').textContent = calcStreak(allGames);

      const updated = data.updated ? new Date(data.updated).toLocaleDateString('en-US', { month:'short', day:'numeric' }) : 'N/A';
      document.getElementById('updated-tag').textContent = 'Updated ' + updated;

      if (allGames.length) renderLatest(allGames[0]);
      renderLog(allGames);

      document.getElementById('loading').style.display  = 'none';
      document.getElementById('app').style.display      = 'block';
      document.getElementById('error-banner').style.display = 'none';

    } catch (err) {
      console.error(err);
      const banner = document.getElementById('error-banner');
      banner.style.display = 'block';
      banner.textContent   = '⚠ Could not load games.json. Make sure the server is running from the project folder. (' + err.message + ')';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }

    btn.classList.remove('spinning');
  }

  loadData();
</script>
</body>
</html>
